<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
<title id="title">Hướng dẫn điều khiển điều hòa</title><desc id="desc">Minh họa các thao tác nhiệt độ, chế độ, quạt, swing và nguồn.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#F9FCFF"/><stop offset="1" stop-color="#E6F4FF"/></linearGradient></defs>
<rect width="1400" height="340" rx="30" fill="url(#bg)"/>
<text x="70" y="58" font-family="Arial" font-size="28" font-weight="800" fill="#0B1F44">Điều khiển thích ứng — chỉ hiện thứ profile thật sự phát được</text>
<text x="70" y="88" font-family="Arial" font-size="17" fill="#60778D">Chạm vào từng chức năng để gửi lệnh IR. Trạng thái hiển thị là “lần cuối đã gửi”, không phải trạng thái live của máy lạnh.</text>
<g transform="translate(80 130)" font-family="Arial">
  <g><rect width="250" height="130" rx="22" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#EAF6FF"/><text x="54" y="64" text-anchor="middle" font-size="30" fill="#087CF0">±</text><text x="98" y="45" font-size="19" font-weight="800" fill="#0B1F44">Nhiệt độ</text><text x="98" y="72" font-size="14" fill="#5E738A">Nhấn + / − để điều chỉnh</text><rect x="18" y="100" width="210" height="8" rx="4" fill="#D7ECFA"/><rect x="18" y="100" width="0" height="8" rx="4" fill="#087CF0"><animate attributeName="width" values="0;210;0" dur="3s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(275 0)"><rect width="250" height="130" rx="22" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#EAF6FF"/><text x="54" y="63" text-anchor="middle" font-size="24" fill="#087CF0">❄</text><text x="98" y="45" font-size="19" font-weight="800" fill="#0B1F44">Chế độ</text><text x="98" y="72" font-size="14" fill="#5E738A">Auto · Cool · Dry · Fan…</text><circle cx="208" cy="31" r="8" fill="#087CF0"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(550 0)"><rect width="250" height="130" rx="22" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#EAF6FF"/><text x="54" y="63" text-anchor="middle" font-size="24" fill="#087CF0">✣</text><text x="98" y="45" font-size="19" font-weight="800" fill="#0B1F44">Tốc độ quạt</text><text x="98" y="72" font-size="14" fill="#5E738A">Auto · Min · Medium · High</text><g transform="translate(208 31)"><circle r="12" fill="none" stroke="#087CF0" stroke-width="3"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/></g></g>
  <g transform="translate(825 0)"><rect width="250" height="130" rx="22" fill="#fff"/><circle cx="54" cy="54" r="28" fill="#EAF6FF"/><text x="54" y="63" text-anchor="middle" font-size="24" fill="#087CF0">↕</text><text x="98" y="45" font-size="19" font-weight="800" fill="#0B1F44">Swing</text><text x="98" y="72" font-size="14" fill="#5E738A">Dọc / ngang khi profile hỗ trợ</text><path d="M180 95 Q208 75 232 95" fill="none" stroke="#19B9F5" stroke-width="4"><animate attributeName="d" values="M180 95 Q208 75 232 95;M180 95 Q208 115 232 95;M180 95 Q208 75 232 95" dur="2s" repeatCount="indefinite"/></path></g>
  <g transform="translate(1100 0)"><rect width="220" height="130" rx="22" fill="#087CF0"/><circle cx="58" cy="54" r="30" fill="#fff" opacity=".16"/><text x="58" y="66" text-anchor="middle" font-size="32" fill="#fff">⏻</text><text x="104" y="45" font-size="19" font-weight="800" fill="#fff">Bật / Tắt</text><text x="104" y="72" font-size="14" fill="#DCEEFF">Gửi lệnh nguồn</text><circle cx="189" cy="30" r="7" fill="#fff"><animate attributeName="r" values="5;10;5" dur="1.4s" repeatCount="indefinite"/></circle></g>
</g>
</svg>