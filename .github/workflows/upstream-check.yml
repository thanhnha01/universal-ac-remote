name: Check upstream revisions

on:
  workflow_dispatch:
  schedule:
    - cron: "53 5 * * 1"

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Compare active upstreams with locked SHAs
        shell: bash
        run: |
          set -o pipefail
          python tools/check_upstreams.py | tee upstream-report.json

      - name: Write upstream summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path("upstream-report.json")
          lines = ["## Upstream revision check", "", "| Source | Status | Locked | Candidate |", "|---|---|---|---|"]
          if report.exists():
              data = json.loads(report.read_text())
              for item in data.get("sources", []):
                  locked = item.get("lockedSha", "-")
                  candidate = item.get("candidateSha", "-")
                  lines.append("| %s | %s | `%s` | `%s` |" % (item["name"], item["status"], locked[:12], candidate[:12]))
              lines += ["", "Changes detected: **%s**" % ("yes" if data.get("changed") else "no")]
          else:
              lines += ["", "The upstream report was not produced because the check failed."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-check-report
          path: upstream-report.json
          retention-days: 14
