name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.8"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Install pinned Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Rebuild and test IR catalog
        run: |
          python3 tools/build_ir_catalog.py
          python3 tools/test_build_ir_catalog.py
          git diff --check
          git diff --exit-code --             data/generated/ir_catalog.json             data/generated/catalog_report.json             app/src/main/assets/catalog-index.json

      - name: Run Android verification
        run: |
          ./gradlew             :app:testDebugUnitTest             :app:lintDebug             :app:assembleDebug             :app:assembleDebugAndroidTest             :app:assembleRelease             --stacktrace

      - name: Verify 16 KB APK alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign"             -v -c -P 16 4             app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universal-ac-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-verification-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
