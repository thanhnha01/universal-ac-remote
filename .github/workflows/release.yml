name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (MAJOR.MINOR.PATCH, e.g. 0.9.0)
        required: true
        type: string
  push:
    tags:
      - "v*"
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - upstream-lock.json
      - data/upstreams/**
      - data/generated/**
      - app/src/main/assets/catalog-index.json

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[ir-auto-update]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: false
      - name: Install pinned Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Derive reproducible version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease | python3 -c '
            import json, re, sys
            versions=[]
            for row in json.load(sys.stdin):
              if row["isDraft"] or row["isPrerelease"]: continue
              match=re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", row["tagName"])
              if match: versions.append(tuple(map(int, match.groups())))
            major, minor, patch=max(versions, default=(0, 0, 0))
            if patch >= 999:
              minor, patch = minor + 1, 0
            else:
              patch += 1
            print(f"{major}.{minor}.{patch}")')
          fi
          python3 - "$version" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          match = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", sys.argv[1])
          if not match: raise SystemExit("tag must be vMAJOR.MINOR.PATCH")
          major, minor, patch = map(int, match.groups())
          if major > 2000 or minor >= 1000 or patch >= 1000: raise SystemExit("version component out of supported range")
          print(f"versionName={sys.argv[1]}")
          print(f"tagName=v{sys.argv[1]}")
          print(f"versionCode={major * 1000000 + minor * 1000 + patch + 1}")
          PY
      - name: Validate tag is newer than every published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current='${{ steps.version.outputs.versionCode }}'
          previous=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease | python3 -c 'import json,re,sys; rows=json.load(sys.stdin); codes=[]
          for row in rows:
            m=re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", row["tagName"])
            if m and not row["isDraft"] and not row["isPrerelease"]:
              a,b,c=map(int,m.groups()); codes.append(a*1000000+b*1000+c+1)
          print(max(codes, default=0))')
          test "$current" -gt "$previous"
      - name: Run catalog and Android verification gates
        run: |
          python3 tools/test_build_ir_catalog.py
          python3 tools/build_ir_catalog.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease -PappVersionName='${{ steps.version.outputs.versionName }}' -PappVersionCode='${{ steps.version.outputs.versionCode }}'
      - name: Sign release APK using Actions secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing. No unsigned release will be published."
              exit 1
            fi
          done
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -v -c -P 16 4 app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk
      - name: Prepare release metadata and assets
        run: |
          apk="app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk"
          hash=$(sha256sum "$apk" | cut -d ' ' -f 1)
          cp data/generated/catalog_report.json catalog_report.json
          python3 - "$hash" "${{ steps.version.outputs.versionName }}" "${{ steps.version.outputs.versionCode }}" <<'PY'
          import datetime, json, pathlib, sys
          digest, name, code = sys.argv[1], sys.argv[2], int(sys.argv[3])
          report=json.loads(pathlib.Path("catalog_report.json").read_text())
          lock=json.loads(pathlib.Path("upstream-lock.json").read_text())
          catalog_hash=__import__("hashlib").sha256(pathlib.Path("data/generated/ir_catalog.json").read_bytes()).hexdigest()
          revisions={s['name']:s['commitSha'] for s in lock['sources']}
          doc={"versionCode":code,"versionName":name,"apkFileName":f"UniversalAC-v{name}.apk","apkSha256":digest,
               "publishedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "releaseNotes":f"IR catalog: {report['totalBrands']} brands, {report['totalProfiles']} profiles.",
               "irDatabaseVersion":catalog_hash,
               "upstreamRevisions":revisions}
          pathlib.Path("update.json").write_text(json.dumps(doc,indent=2)+"\n")
          notes=[f"Universal A/C Remote {name}","",f"Catalog: {report['totalBrands']} brands, {report['totalProfiles']} profiles.",
                 "", "Upstream revisions:", *[f"- {source}: {sha}" for source,sha in revisions.items()]]
          pathlib.Path("release-notes.md").write_text("\n".join(notes)+"\n")
          PY
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Attest release APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tagName }}" \
            "app/build/outputs/apk/release/UniversalAC-v${{ steps.version.outputs.versionName }}.apk" \
            update.json SHA256SUMS.txt upstream-lock.json catalog_report.json \
            --title "Universal A/C Remote ${{ steps.version.outputs.versionName }}" \
            --notes-file release-notes.md \
            --target "${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}"
